services:
  - type: web
    name: tp-web2-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        fromDatabase:
          name: web2-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: web2-db
          property: password
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: web2-db
    plan: free
    databaseName: web2
    user: web2
