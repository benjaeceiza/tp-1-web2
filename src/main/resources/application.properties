spring.application.name=api-blank
server.port=${PORT:8080}

# Conexión a la base de datos PostgreSQL (con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/apiblank_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate 
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Configuración de JWT para Spring Security (mínimo 32 caracteres para HMAC-SHA)
jwt.secret=${JWT_SECRET:mi_clave_secreta_super_segura_para_jwt_tp3_web2_2026}
jwt.expiration=${JWT_EXPIRATION:86400000}
